name: Publish Intel Mac release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app version
        required: true
        default: "v0.6.2"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      release-tag: ${{ inputs.tag }}
      intel-only: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reader-mac-intel-x64
          path: release
      - name: Generate checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test -s "release/Reader-${version}-mac-intel-x64.dmg"
          test -s "release/Reader-${version}-mac-intel-x64.zip"
          cd release
          sha256sum "Reader-${version}-mac-intel-x64.dmg" "Reader-${version}-mac-intel-x64.zip" > SHA256SUMS-intel.txt
      - name: Publish Intel Mac installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Reader ${version} for Intel Mac" \
              --notes "Reader ${version} for Intel Macs. Includes the DMG installer and ZIP update package."
          fi
