name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  desktop:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      windows-only: true
